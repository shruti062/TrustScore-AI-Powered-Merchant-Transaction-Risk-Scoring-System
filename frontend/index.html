<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrustScore - AI Risk Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1">TrustScore</span>
        <span class="text-light small">AI-Powered Merchant Risk Radar</span>
    </nav>

    <div class="container mt-4">

        <!-- Summary cards -->
        <div class="row mb-4" id="summaryCards">
            <div class="col-md-3">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Transactions Scored</h6>
                        <h3 id="statTotal">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Blocked</h6>
                        <h3 id="statBlocked" class="text-danger">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Under Review</h6>
                        <h3 id="statReview" class="text-warning">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-center shadow-sm">
                    <div class="card-body">
                        <h6 class="text-muted">Allowed</h6>
                        <h3 id="statAllowed" class="text-success">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <button class="btn btn-primary mb-4" id="simulateBtn">
            Simulate Transaction
        </button>

        <div class="row">
            <!-- Recent transactions table -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header">Recent Transactions</div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Txn ID</th>
                                    <th>Merchant</th>
                                    <th>Amount</th>
                                    <th>Risk Score</th>
                                    <th>Action</th>
                                    <th>Reasons</th>
                                </tr>
                            </thead>
                            <tbody id="transactionsTable">
                                <!-- filled by script.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Merchant risk summary -->
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header">Merchant Risk Summary</div>
                    <div class="card-body p-0">
                        <table class="table mb-0">
                            <thead>
                                <tr>
                                    <th>Merchant</th>
                                    <th>Avg Score</th>
                                    <th>Flagged</th>
                                </tr>
                            </thead>
                            <tbody id="merchantTable">
                                <!-- filled by script.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
