<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrustScore - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="height:100vh;">

    <div class="card shadow-sm p-4" style="width: 380px;">
        <h4 class="mb-3 text-center">TrustScore</h4>
        <p class="text-muted text-center small mb-4">Risk Analyst Login</p>

        <div id="alertBox" class="alert alert-danger d-none"></div>

        <form id="loginForm" class="mb-3">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>

        <hr>

        <p class="small text-muted text-center mb-2">New reviewer?</p>
        <form id="registerForm">
            <div class="mb-2">
                <input type="text" class="form-control form-control-sm" id="newUsername" placeholder="Choose a username" required>
            </div>
            <div class="mb-2">
                <input type="password" class="form-control form-control-sm" id="newPassword" placeholder="Choose a password" required>
            </div>
            <button type="submit" class="btn btn-outline-secondary btn-sm w-100">Register</button>
        </form>
    </div>

    <script>
        const alertBox = document.getElementById("alertBox");

        function showError(msg) {
            alertBox.innerText = msg;
            alertBox.classList.remove("d-none");
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const res = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password }),
            });
            const data = await res.json();

            if (!res.ok) {
                showError(data.error || "Login failed");
                return;
            }

            localStorage.setItem("trustscore_token", data.access_token);
            localStorage.setItem("trustscore_username", data.username);
            localStorage.setItem("trustscore_role", data.role);
            window.location.href = "/";
        });

        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const username = document.getElementById("newUsername").value;
            const password = document.getElementById("newPassword").value;

            const res = await fetch("/api/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password, role: "analyst" }),
            });
            const data = await res.json();

            if (!res.ok) {
                showError(data.error || "Registration failed");
                return;
            }

            alertBox.classList.remove("d-none", "alert-danger");
            alertBox.classList.add("alert-success");
            alertBox.innerText = "Registered! You can log in now.";
        });
    </script>
</body>
</html>
