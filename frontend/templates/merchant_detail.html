<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrustScore - Merchant Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    {% include "partials/navbar.html" %}

    <div class="container mt-4">

        <a href="/" class="back-link">&larr; Back to dashboard</a>

        <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h3 id="merchantTitle">-</h3>
                <p class="subtitle mb-0"><span id="txnCount">0</span> transactions scored</p>
            </div>
            <div class="card summary-stat-card text-center shadow-sm" style="min-width: 180px;" id="avgScoreCard">
                <div class="card-body py-3">
                    <h6 class="text-muted mb-1">Average Risk Score</h6>
                    <h2 id="avgRiskScore" class="mb-0">-</h2>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header">Risk Score Over Time</div>
            <div class="card-body">
                <canvas id="merchantTrendChart" height="70"></canvas>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header">Transaction History <span class="small text-muted">(click a row for details)</span></div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Txn ID</th>
                            <th>Amount</th>
                            <th>Risk Score</th>
                            <th>Action</th>
                            <th>When</th>
                        </tr>
                    </thead>
                    <tbody id="merchantTxnTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="{{ url_for('static', filename='toast.js') }}"></script>
    <script src="{{ url_for('static', filename='common.js') }}"></script>
    <script src="{{ url_for('static', filename='notifications.js') }}"></script>
    <script>const MERCHANT_ID = {{ merchant_id | tojson }};</script>
    <script src="{{ url_for('static', filename='merchant_detail.js') }}"></script>
</body>
</html>
