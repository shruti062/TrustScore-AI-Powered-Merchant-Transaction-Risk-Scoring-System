<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrustScore - Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    {% include "partials/navbar.html" %}

    <div class="container mt-4" style="max-width: 600px;">

        <a href="/" class="back-link">&larr; Back to dashboard</a>

        <div class="page-header">
            <h3>My Profile</h3>
            <p class="subtitle">Account details and security settings</p>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="profile-info-row">
                    <span class="label">Username</span>
                    <span class="value" id="profileUsername">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="label">Role</span>
                    <span class="value" id="profileRole">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="label">Joined</span>
                    <span class="value" id="profileJoined">-</span>
                </div>
                <div class="profile-info-row">
                    <span class="label">Feedback submitted</span>
                    <span class="value" id="profileFeedbackCount">-</span>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header">Change Password</div>
            <div class="card-body">
                <div id="passwordError" class="alert alert-danger d-none small"></div>
                <div class="mb-3">
                    <label class="form-label">Current password</label>
                    <input type="password" class="form-control" id="oldPassword">
                </div>
                <div class="mb-3">
                    <label class="form-label">New password</label>
                    <input type="password" class="form-control" id="newPassword">
                </div>
                <button class="btn btn-primary" id="changePasswordBtn">Update Password</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="{{ url_for('static', filename='toast.js') }}"></script>
    <script src="{{ url_for('static', filename='common.js') }}"></script>
    <script src="{{ url_for('static', filename='notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='profile.js') }}"></script>
</body>
</html>
