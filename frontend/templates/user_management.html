<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TrustScore - User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    {% include "partials/navbar.html" %}

    <div class="container mt-4" style="max-width: 800px;">

        <a href="/admin" class="back-link">&larr; Back to admin panel</a>

        <h3 class="mt-3 mb-4">User Management</h3>

        <div id="accessDenied" class="alert alert-danger d-none">
            This page is only available to admin accounts.
        </div>

        <div id="usersContent" class="d-none card shadow-sm">
            <div class="card-body p-0">
                <table class="table mb-0">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Joined</th>
                            <th>Change Role</th>
                        </tr>
                    </thead>
                    <tbody id="usersTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <script src="{{ url_for('static', filename='toast.js') }}"></script>
    <script src="{{ url_for('static', filename='common.js') }}"></script>
    <script src="{{ url_for('static', filename='notifications.js') }}"></script>
    <script src="{{ url_for('static', filename='user_management.js') }}"></script>
</body>
</html>
